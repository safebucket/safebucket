name: Build and push Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v2.1.3

permissions:
  contents: read

jobs:
  check-branch:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type == 'tag'
    outputs:
      on-default-branch: ${{ steps.check.outputs.on-default-branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history to check branch
          persist-credentials: false

      - name: Check if tag is on main or release branch
        id: check
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Check if the tag exists on main or a release branch
          if git branch -r --contains "$TAG_NAME" | grep -qE "origin/(main|release/)"; then
            echo "Tag $TAG_NAME is on an allowed branch"
            echo "on-default-branch=true" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG_NAME is NOT on main or a release branch"
            echo "on-default-branch=false" >> $GITHUB_OUTPUT
            exit 1
          fi

  build-amd64:
    needs: [ check-branch ]
    if: |
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (needs.check-branch.result == 'success' && needs.check-branch.outputs.on-default-branch == 'true'))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-arch.yml
    with:
      arch: amd64
      runner: ubuntu-latest
      platform: linux/amd64
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  build-arm64:
    needs: [ check-branch ]
    if: |
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (needs.check-branch.result == 'success' && needs.check-branch.outputs.on-default-branch == 'true'))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-arch.yml
    with:
      arch: arm64
      runner: ubuntu-24.04-arm
      platform: linux/arm64
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  prepare-tags:
    runs-on: ubuntu-latest
    needs: [ check-branch ]
    if: |
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (needs.check-branch.result == 'success' && needs.check-branch.outputs.on-default-branch == 'true'))
    outputs:
      tags: ${{ steps.extract.outputs.tags }}
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/safebucket/safebucket
            ghcr.io/safebucket/safebucket
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=main,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Extract bare tags
        id: extract
        env:
          REFS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tags=$(printf '%s\n' "$REFS" | sed 's|.*:||' | sed '/^$/d' | sort -u)
          if [[ -z "$tags" ]]; then
            echo "::error::docker/metadata-action produced no tags for ${{ github.ref }}"
            exit 1
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  manifests:
    needs: [ check-branch, prepare-tags, build-amd64, build-arm64 ]
    if: |
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (needs.check-branch.result == 'success' && needs.check-branch.outputs.on-default-branch == 'true')) &&
      needs.prepare-tags.result == 'success' &&
      needs.build-amd64.result == 'success' &&
      needs.build-arm64.result == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-manifests.yml
    with:
      tags: ${{ needs.prepare-tags.outputs.tags }}
      amd64-digest-dockerhub: ${{ needs.build-amd64.outputs.digest-dockerhub }}
      amd64-digest-ghcr: ${{ needs.build-amd64.outputs.digest-github }}
      arm64-digest-dockerhub: ${{ needs.build-arm64.outputs.digest-dockerhub }}
      arm64-digest-ghcr: ${{ needs.build-arm64.outputs.digest-github }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  release:
    needs: [check-branch, build-amd64, build-arm64, manifests]
    if: >
      github.ref_type == 'tag' &&
      needs.manifests.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: binary-linux-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum safebucket-linux-* > checksums.txt

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign binaries
        working-directory: dist
        run: |
          for bin in safebucket-linux-*; do
            cosign sign-blob --yes --output-signature "${bin}.sig" --output-certificate "${bin}.pem" "${bin}"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/safebucket-linux-amd64
            dist/safebucket-linux-amd64.sig
            dist/safebucket-linux-amd64.pem
            dist/safebucket-linux-arm64
            dist/safebucket-linux-arm64.sig
            dist/safebucket-linux-arm64.pem
            dist/checksums.txt
