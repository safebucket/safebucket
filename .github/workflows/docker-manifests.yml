name: Create and sign multi-arch manifests

on:
  workflow_call:
    inputs:
      tags:
        description: 'Tags to attach to the multi-arch manifests, one per line (e.g. main, v1.0.0)'
        required: true
        type: string
      amd64-digest-dockerhub:
        description: 'amd64 image digest on Docker Hub'
        required: true
        type: string
      amd64-digest-ghcr:
        description: 'amd64 image digest on GitHub Container Registry'
        required: true
        type: string
      arm64-digest-dockerhub:
        description: 'arm64 image digest on Docker Hub'
        required: true
        type: string
      arm64-digest-ghcr:
        description: 'arm64 image digest on GitHub Container Registry'
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  create-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      TAGS: ${{ inputs.tags }}
      AMD64_DIGEST_DOCKERHUB: ${{ inputs.amd64-digest-dockerhub }}
      ARM64_DIGEST_DOCKERHUB: ${{ inputs.arm64-digest-dockerhub }}
      AMD64_DIGEST_GHCR: ${{ inputs.amd64-digest-ghcr }}
      ARM64_DIGEST_GHCR: ${{ inputs.arm64-digest-ghcr }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Docker Hub manifests
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            echo "Creating Docker Hub manifest for: $tag"
            docker buildx imagetools create \
              --tag "docker.io/safebucket/safebucket:$tag" \
              "docker.io/safebucket/safebucket@$AMD64_DIGEST_DOCKERHUB" \
              "docker.io/safebucket/safebucket@$ARM64_DIGEST_DOCKERHUB"
          done <<< "$TAGS"

      - name: Create GHCR manifests
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            echo "Creating GHCR manifest for: $tag"
            docker buildx imagetools create \
              --tag "ghcr.io/safebucket/safebucket:$tag" \
              "ghcr.io/safebucket/safebucket@$AMD64_DIGEST_GHCR" \
              "ghcr.io/safebucket/safebucket@$ARM64_DIGEST_GHCR"
          done <<< "$TAGS"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the images
        run: |
          set -euo pipefail
          for repo in docker.io/safebucket/safebucket ghcr.io/safebucket/safebucket; do
            while IFS= read -r tag; do
              [[ -z "$tag" ]] && continue
              digest=$(docker buildx imagetools inspect "$repo:$tag" --format '{{json .Manifest}}' | jq -r '.digest')
              echo "Signing $repo@$digest"
              cosign sign --yes "$repo@$digest"
            done <<< "$TAGS"
          done
