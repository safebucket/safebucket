name: Create and sign multi-arch manifests

on:
  workflow_call:
    inputs:
      tags:
        description: 'Tags to attach to the multi-arch manifests, one per line (e.g. main, v1.0.0)'
        required: true
        type: string
      amd64-digest-dockerhub:
        description: 'amd64 image digest on Docker Hub'
        required: true
        type: string
      amd64-digest-ghcr:
        description: 'amd64 image digest on GitHub Container Registry'
        required: true
        type: string
      arm64-digest-dockerhub:
        description: 'arm64 image digest on Docker Hub'
        required: true
        type: string
      arm64-digest-ghcr:
        description: 'arm64 image digest on GitHub Container Registry'
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  create-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      TAGS: ${{ inputs.tags }}
      AMD64_DIGEST_DOCKERHUB: ${{ inputs.amd64-digest-dockerhub }}
      ARM64_DIGEST_DOCKERHUB: ${{ inputs.arm64-digest-dockerhub }}
      AMD64_DIGEST_GHCR: ${{ inputs.amd64-digest-ghcr }}
      ARM64_DIGEST_GHCR: ${{ inputs.arm64-digest-ghcr }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          if [[ -z "${TAGS//[[:space:]]/}" ]]; then
            echo "::error::no tags supplied; refusing to publish nothing"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Docker Hub manifests
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            tag_args+=(--tag "docker.io/safebucket/safebucket:$tag")
          done <<< "$TAGS"
          echo "Creating Docker Hub manifest with: ${tag_args[*]}"
          docker buildx imagetools create "${tag_args[@]}" \
            "docker.io/safebucket/safebucket@$AMD64_DIGEST_DOCKERHUB" \
            "docker.io/safebucket/safebucket@$ARM64_DIGEST_DOCKERHUB"

      - name: Create GHCR manifests
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            tag_args+=(--tag "ghcr.io/safebucket/safebucket:$tag")
          done <<< "$TAGS"
          echo "Creating GHCR manifest with: ${tag_args[*]}"
          docker buildx imagetools create "${tag_args[@]}" \
            "ghcr.io/safebucket/safebucket@$AMD64_DIGEST_GHCR" \
            "ghcr.io/safebucket/safebucket@$ARM64_DIGEST_GHCR"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the images
        run: |
          set -euo pipefail
          for repo in docker.io/safebucket/safebucket ghcr.io/safebucket/safebucket; do
            raw=$(
              while IFS= read -r tag; do
                [[ -z "$tag" ]] && continue
                docker buildx imagetools inspect "$repo:$tag" \
                  --format '{{json .Manifest}}' | jq -r '.digest'
              done <<< "$TAGS"
            )
            digests=$(printf '%s\n' "$raw" | sed '/^$/d' | sort -u)
            if [[ -z "$digests" ]]; then
              echo "::error::no digests resolved for $repo"
              exit 1
            fi
            while IFS= read -r digest; do
              echo "Signing $repo@$digest"
              cosign sign --yes "$repo@$digest"
            done <<< "$digests"
          done
